# Purpose: Manages how Docker containers are created and run.
# What it does:
# - Defines service names.
# - Builds or pulls Docker images.
# - Configures container names.
# - Passes environment variables.
# - Configures volumes and networks.
# - Runs test commands.

services:
  playwright:
    # Builds the image from the Dockerfile in this folder
    build:
      context: .
      dockerfile: Dockerfile
    image: playwright-docker-project
    container_name: playwright-docker-container
 
    # Chromium stability in containers
    init: true
    ipc: host
 
    # Read by docker-entrypoint.sh and playwright.config.ts
    environment:
      CI: ${CI:-false}
      BROWSER: ${BROWSER:-chromium}
      ENV_NAME: ${ENV_NAME:-QA}
 
    # Reports and output appear on your machine
    volumes:
      - .:/app
      - /app/node_modules
      - ./playwright-report:/app/playwright-report
      - ./test-output:/app/test-output
 
    tty: true
    stdin_open: true